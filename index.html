<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSGradient - Gradient Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">✨</div>
                <h1 data-i18n="title">CSSGradient</h1>
            </div>
            <div class="language-selector">
                <select id="langSelect">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="es">Español</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                </select>
            </div>
        </header>

        <main class="main-content">
            <div class="preview-section">
                <div class="gradient-preview" id="gradientPreview">
                    <div class="preview-content">
                        <span class="preview-text" data-i18n="previewText">CSS Gradient</span>
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <div class="gradient-type">
                    <button class="type-btn active" data-type="linear" data-i18n="linear">Linear</button>
                    <button class="type-btn" data-type="radial" data-i18n="radial">Radial</button>
                </div>

                <div class="angle-control" id="angleControl">
                    <label data-i18n="angle">Angle</label>
                    <div class="angle-input">
                        <input type="range" id="angleSlider" min="0" max="360" value="90">
                        <input type="number" id="angleValue" value="90" min="0" max="360">
                        <span>°</span>
                    </div>
                </div>

                <div class="color-stops" id="colorStops">
                    <div class="color-stop" data-index="0">
                        <input type="color" class="color-picker" value="#667eea">
                        <input type="number" class="position-input" value="0" min="0" max="100">
                        <span>%</span>
                        <button class="remove-stop" data-i18n="remove">×</button>
                    </div>
                    <div class="color-stop" data-index="1">
                        <input type="color" class="color-picker" value="#764ba2">
                        <input type="number" class="position-input" value="100" min="0" max="100">
                        <span>%</span>
                        <button class="remove-stop" data-i18n="remove">×</button>
                    </div>
                </div>

                <button class="add-stop-btn" id="addStopBtn" data-i18n="addColor">+ Add Color Stop</button>

                <div class="presets">
                    <h3 data-i18n="presets">Presets</h3>
                    <div class="preset-grid" id="presetGrid">
                        <!-- Presets will be generated by JS -->
                    </div>
                </div>

                <div class="css-output">
                    <h3 data-i18n="cssCode">CSS Code</h3>
                    <div class="code-box">
                        <code id="cssCode">background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);</code>
                        <button class="copy-btn" id="copyBtn" data-i18n="copy">Copy</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p data-i18n="footer">Made with 💜 by CSSGradient</p>
        </footer>
    </div>

    <div class="toast" id="toast" data-i18n="copied">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
